name: Refresh CFB model

on:
  schedule:
    # Monday at 6:00 AM Central during daylight-saving time.
    - cron: '0 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-model-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODEL_URL: https://cfb-model-app.vercel.app/api/jobs/update
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}

    steps:
      - name: Check configuration
        shell: bash
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing the CRON_SECRET repository secret."
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "Missing the NEXT_PUBLIC_SUPABASE_URL repository secret."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing the SUPABASE_SERVICE_ROLE_KEY repository secret."
            exit 1
          fi
          if [ -z "$CFBD_API_KEY" ]; then
            echo "Missing the CFBD_API_KEY repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Refresh 2026 source data
        shell: bash
        run: |
          set -euo pipefail

          update() {
            local payload="$1"
            echo "Running: $payload"
            curl --fail-with-body --silent --show-error --retry 2 --max-time 300 \
              --request POST "$MODEL_URL" \
              --header "Authorization: Bearer $CRON_SECRET" \
              --header "Content-Type: application/json" \
              --data "$payload"
            echo
          }

          update '{"season":2026,"step":"teams,games,coaches"}'
          update '{"season":2026,"step":"stats"}'
          update '{"season":2026,"step":"rosters","limit":20,"offset":0}'
          update '{"season":2026,"step":"rosters","limit":20,"offset":20}'
          update '{"season":2026,"step":"rosters","limit":20,"offset":40}'
          update '{"season":2026,"step":"rosters","limit":20,"offset":60}'

      - name: Recalculate ratings and predictions
        shell: bash
        run: |
          set -euo pipefail

          for season in 2022 2023 2024 2025 2026; do
            echo "Calculating ratings for $season"
            curl --fail-with-body --silent --show-error --retry 2 --max-time 300 \
              --request POST "$MODEL_URL" \
              --header "Authorization: Bearer $CRON_SECRET" \
              --header "Content-Type: application/json" \
              --data "{\"season\":$season,\"step\":\"ratings,predictions\"}"
            echo
          done

      - name: Optimize and rebuild backtests
        shell: bash
        run: |
          set -euo pipefail

          echo "Running full optimizer against 2025 as the completed holdout season"
          npm run job:full-optimizer -- --season=2025

          for season in 2022 2023 2024 2025; do
            echo "Rebuilding backtest for $season with active optimized weights"
            curl --fail-with-body --silent --show-error --retry 2 --max-time 300 \
              --request POST "$MODEL_URL" \
              --header "Authorization: Bearer $CRON_SECRET" \
              --header "Content-Type: application/json" \
              --data "{\"season\":$season,\"step\":\"backtest\",\"optimizeBacktest\":false}"
            echo
          done

      - name: Regenerate 2026 predictions with optimized weights
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --max-time 300 \
            --request POST "$MODEL_URL" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{"season":2026,"step":"predictions"}'
          echo
