name: Full CFB optimizer

on:
  workflow_dispatch:
    inputs:
      season:
        description: Completed season to use as the holdout season
        required: true
        default: '2025'

permissions:
  contents: read

concurrency:
  group: cfb-full-optimizer
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      OPTIMIZER_SEASON: ${{ inputs.season }}

    steps:
      - name: Check configuration
        shell: bash
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "Missing NEXT_PUBLIC_SUPABASE_URL repository secret."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing SUPABASE_SERVICE_ROLE_KEY repository secret."
            exit 1
          fi
          if [ -z "$CFBD_API_KEY" ]; then
            echo "Missing CFBD_API_KEY repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run full optimizer
        run: npm run job:full-optimizer -- --season=${{ inputs.season }}
