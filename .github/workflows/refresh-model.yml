name: Refresh CFB model

on:
  schedule:
    # Monday at 6:00 AM Central during daylight-saving time.
    - cron: '0 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-model-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODEL_URL: https://cfb-model-app.vercel.app/api/jobs/update
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}

    steps:
      - name: Check configuration
        shell: bash
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing the CRON_SECRET repository secret."
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "Missing the NEXT_PUBLIC_SUPABASE_URL repository secret."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing the SUPABASE_SERVICE_ROLE_KEY repository secret."
            exit 1
          fi
          if [ -z "$CFBD_API_KEY" ]; then
            echo "Missing the CFBD_API_KEY repository secret."
            exit 1
          fi

      - name: Refresh this week's games and stats
        shell: bash
        run: |
          set -euo pipefail

          update() {
            local payload="$1"
            echo "Running: $payload"
            curl --fail-with-body --silent --show-error --retry 2 --max-time 300 \
              --request POST "$MODEL_URL" \
              --header "Authorization: Bearer $CRON_SECRET" \
              --header "Content-Type: application/json" \
              --data "$payload"
            echo
          }

          update '{"season":2026,"step":"games"}'
          update '{"season":2026,"step":"stats"}'

      - name: Recalculate 2026 ratings and predictions
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --retry 2 --max-time 300 \
            --request POST "$MODEL_URL" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{"season":2026,"step":"ratings,predictions"}'
          echo
